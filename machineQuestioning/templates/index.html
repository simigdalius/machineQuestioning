<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>machineQuestioning</title>
    <style>
        /* Γενικό Retro Dark Theme */
        body { 
            background-color: #0a0a0a; 
            color: #00ff41; 
            font-family: 'Courier New', Courier, monospace; 
            max-width: 900px; /* Φάρδυνε το container για να χωράει η μπάρα */
            margin: 40px auto; 
            padding: 20px; 
        }

        /* Layout με Flexbox */
        #main-wrapper {
            display: flex;
            gap: 30px;
        }

        /* Αριστερό μέρος (Quiz) */
        #quiz-area {
            flex: 3;
        }

        /* Δεξί μέρος (Sidebar) */
        #sidebar {
            flex: 1;
            border-left: 2px dashed #00ff41;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h1.app-title { 
            text-align: center; 
            font-size: 2.8em; 
            margin-bottom: 30px; 
            text-shadow: 0 0 10px #00ff41; 
            border-bottom: 2px dashed #00ff41;
            padding-bottom: 15px;
            letter-spacing: 2px;
        }

        /* Κουμπιά Επιλογών */
        .option-btn { 
            display: block; 
            width: 100%; 
            margin: 12px 0; 
            padding: 15px; 
            cursor: pointer; 
            text-align: left; 
            background: transparent; 
            color: #00ff41; 
            border: 2px solid #00ff41; 
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
        }
        .option-btn:hover:not(:disabled) { 
            background: #00ff41; color: #0a0a0a; box-shadow: 0 0 15px #00ff41; 
        }

        .correct { background-color: #00ffff !important; border-color: #00ffff !important; color: #0a0a0a !important; box-shadow: 0 0 20px #00ffff; }
        .wrong { background-color: #ff003c !important; border-color: #ff003c !important; color: #ffffff !important; box-shadow: 0 0 20px #ff003c; }

        #explanation-box { margin-top: 25px; padding: 15px; display: none; background: #111111; border: 1px dotted #00ff41; line-height: 1.6; }
        #result-title { font-size: 1.2em; letter-spacing: 1px; display: block; margin-bottom: 10px; }

        #next-btn { 
            margin-top: 20px; padding: 12px 25px; display: none; cursor: pointer; 
            background: transparent; color: #ff00ff; border: 2px solid #ff00ff; 
            font-family: 'Courier New', Courier, monospace; font-size: 1.1em; font-weight: bold; text-transform: uppercase; transition: 0.2s; 
        }
        #next-btn:hover { background: #ff00ff; color: #0a0a0a; box-shadow: 0 0 15px #ff00ff; }

        #question-text::before { content: "> "; }

        /* Στυλ για τη Sidebar */
        .sidebar-title { font-size: 1.2em; text-transform: uppercase; border-bottom: 1px solid #00ff41; padding-bottom: 5px; margin-bottom: 10px;}
        .filter-label {
            display: block; cursor: pointer; font-size: 1em; padding: 5px 0; transition: 0.2s;
        }
        .filter-label:hover { color: #00ffff; text-shadow: 0 0 5px #00ffff;}
        .filter-label input { cursor: pointer; margin-right: 10px; accent-color: #00ff41;}
        
        #progress-counter {
            margin-top: 20px; font-weight: bold; color: #ff00ff;
        }
    </style>
</head>
<body>
    <h1 class="app-title">machineQuestioning</h1>
    
    <div id="main-wrapper">
        
        <div id="quiz-area">
            <div id="quiz-container">
                <h3 id="question-text"> SYSTEM.LOAD("QUESTIONS")...</h3>
                <div id="options-container"></div>
                <div id="explanation-box">
                    <strong id="result-title"></strong>
                    <p id="explanation-text"></p>
                </div>
                <button id="next-btn" onclick="loadNextQuestion()">ΕΠΟΜΕΝΟ >_</button>
            </div>
        </div>

        <div id="sidebar">
            <div class="sidebar-title">ΕΠΙΛΟΓΗ ΚΕΦΑΛΑΙΟΥ</div>
            <label class="filter-label"><input type="radio" name="chapter" value="Όλα" checked onchange="applyFilter()"> ΟΛΑ</label>
            <label class="filter-label"><input type="radio" name="chapter" value="Εισαγωγή" onchange="applyFilter()"> ΕΙΣΑΓΩΓΗ</label>
            <label class="filter-label"><input type="radio" name="chapter" value="k-NN & Δέντρα" onchange="applyFilter()"> K-NN & ΔΕΝΤΡΑ</label>
            <label class="filter-label"><input type="radio" name="chapter" value="Νευρωνικά Δίκτυα" onchange="applyFilter()"> ΝΕΥΡΩΝΙΚΑ ΔΙΚΤΥΑ</label>
            
            <div id="progress-counter">ΕΡΩΤΗΣΗ: 0 / 0</div>
        </div>

    </div>

    <script>
        let allQuestions = [];       // Όλες οι ερωτήσεις από το API
        let filteredQuestions = [];  // Οι ερωτήσεις του επιλεγμένου κεφαλαίου
        let currentIndex = 0;

        // Fetch από το backend
        fetch('/api/questions')
            .then(res => res.json())
            .then(data => {
                allQuestions = data;
                applyFilter(); // Εφαρμόζει αρχικά το φίλτρο "Όλα" και ξεκινάει
            });

        // Αλγόριθμος Fisher-Yates για τέλειο ανακάτεμα πίνακα
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Φιλτράρισμα βάσει επιλογής από τα ραδιοφωνικά κουμπιά
        function applyFilter() {
            const selectedChapter = document.querySelector('input[name="chapter"]:checked').value;
            
            if (selectedChapter === "Όλα") {
                filteredQuestions = [...allQuestions];
            } else {
                filteredQuestions = allQuestions.filter(q => q.chapter === selectedChapter);
            }

            // Ανακατεύουμε τις ερωτήσεις του επιλεγμένου κεφαλαίου
            shuffleArray(filteredQuestions);
            currentIndex = 0;
            showQuestion();
        }

        function showQuestion() {
            // Ενημέρωση Counter (π.χ. ΕΡΩΤΗΣΗ: 1 / 15)
            document.getElementById('progress-counter').innerText = `ΕΡΩΤΗΣΗ: ${Math.min(currentIndex + 1, filteredQuestions.length)} / ${filteredQuestions.length}`;

            if (currentIndex >= filteredQuestions.length) {
                document.getElementById('quiz-container').innerHTML = "<h3 style='text-align:center; text-shadow: 0 0 10px #00ff41;'>> TASK_COMPLETED. ΚΑΝΕ ΕΠΑΝΕΚΚΙΝΗΣΗ Η' ΑΛΛΑΞΕ ΚΕΦΑΛΑΙΟ ΑΠΟ ΔΕΞΙΑ.</h3>";
                return;
            }

            const q = filteredQuestions[currentIndex];
            
            // Τοποθέτηση του ονόματος του κεφαλαίου πάνω από την ερώτηση
            document.getElementById('question-text').innerHTML = `<span style="color:#00ffff; font-size:0.8em;">[${q.chapter}]</span><br>> ${q.question}`;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; 

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `[${index + 1}] ${opt}`; 
                btn.onclick = () => submitAnswer(q.id, index, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation-box').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
        }

        function submitAnswer(questionId, selectedIndex, btnElement) {
            const allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(b => b.disabled = true);

            fetch('/api/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: questionId, answer_index: selectedIndex })
            })
            .then(res => res.json())
            .then(data => {
                const expBox = document.getElementById('explanation-box');
                const resTitle = document.getElementById('result-title');
                const expText = document.getElementById('explanation-text');

                expBox.style.display = 'block';
                document.getElementById('next-btn').style.display = 'inline-block';

                if (data.is_correct) {
                    btnElement.classList.add('correct');
                    resTitle.innerText = "STATUS: CORRECT";
                    resTitle.style.color = "#00ffff"; 
                } else {
                    btnElement.classList.add('wrong');
                    resTitle.innerText = "STATUS: ERROR";
                    resTitle.style.color = "#ff003c"; 
                    allButtons[data.correct_index].classList.add('correct');
                }

                expText.innerText = data.explanation;
            });
        }

        function loadNextQuestion() {
            currentIndex++;
            showQuestion();
        }
    </script>
</body>
</html>
